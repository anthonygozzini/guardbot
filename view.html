<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GuardBot — Approvals Viewer</title>
<style>
:root{--bg:#0b0d10;--panel:#14171c;--line:#232830;--ink:#e8ebe6;--soft:#9aa2ab;--faint:#6f767e;
--accent:#33d59d;--warn:#e2a244;--risk:#f0685c;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--soft);margin:0 0 22px;font-size:.95rem}
.sub b{color:var(--accent)}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
border-radius:10px;padding:12px 14px;font-family:var(--mono);font-size:.9rem}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{background:var(--accent);color:#06251a;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.hint{color:var(--faint);font-size:.8rem;margin:8px 0 0;font-family:var(--mono)}
.status{margin:20px 0 10px;color:var(--soft)}
.status b{color:var(--ink)}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.88rem}
th{text-align:left;color:var(--faint);font-weight:500;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.mono{font-family:var(--mono);font-size:.82rem}
.chip{display:inline-block;font-family:var(--mono);font-size:.68rem;padding:2px 7px;border-radius:100px;border:1px solid var(--line);color:var(--soft)}
.tag{display:inline-block;font-family:var(--mono);font-size:.66rem;padding:2px 8px;border-radius:100px;font-weight:600;margin-right:6px;vertical-align:middle}
.tag-cached{background:#2a1f0f;color:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.tag-live{background:#0d2a20;color:var(--accent)}
.fake{color:var(--risk);font-weight:600}
.chip-est{border-color:var(--accent);color:var(--accent)}
button.rev{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:8px;
padding:5px 11px;font-size:.78rem;font-weight:600;cursor:pointer}
button.rev:hover{border-color:var(--risk);color:var(--risk)}
.signbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.signhead{font-weight:700;margin-bottom:10px}
.sigline{margin:3px 0;font-size:.85rem;color:var(--soft)}
.sigline b{color:var(--faint);display:inline-block;min-width:52px}
.sigdata{margin:10px 0;padding:9px;background:var(--bg);border-radius:8px;font-size:.72rem;
word-break:break-all;color:var(--faint);max-height:88px;overflow:auto}
.sigacts{display:flex;gap:9px;margin-top:6px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--soft)}
.simrow{margin:9px 0;padding:8px 10px;border-radius:8px;font-size:.82rem;font-weight:600}
.simok{background:#0d2a20;color:var(--accent)}
.simwarn{background:#2a1f0f;color:var(--warn)}
.tname{color:var(--soft);font-size:.78rem}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.tag-cached{animation:none}}
.badge{font-family:var(--mono);font-size:.68rem;padding:2px 8px;border-radius:100px;font-weight:600}
.b-unl{background:#2c1613;color:var(--risk)}
.b-risk{background:#2a1f0f;color:var(--warn)}
.b-ok{background:#0d2a20;color:var(--accent)}
.lvl{font-family:var(--mono);font-size:.68rem;padding:2px 9px;border-radius:100px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.lvl-minimal,.lvl-low{background:#0d2a20;color:var(--accent)}
.lvl-medium{background:#2a2610;color:#dcc148}
.lvl-high{background:#2a1f0f;color:var(--warn)}
.lvl-critical{background:#2c1613;color:var(--risk)}
.trunc{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:bottom}
.empty{color:var(--soft);padding:24px 10px;text-align:center}
.err{color:var(--risk);padding:14px;border:1px dashed var(--risk);border-radius:10px;background:#2c1613}
a{color:var(--accent)}
</style></head>
<body><div class="wrap">
  <h1>⚡ GuardBot — Approvals Viewer</h1>
  <p class="sub">Paste any address, see its standing token approvals across <b>EVM · TRON · Solana</b> — the chains a single revoke tool usually doesn't unify. Read-only, no wallet needed.</p>
  <form id="f">
    <input id="addr" placeholder="0x… (EVM)  ·  T… (TRON)  ·  base58 (Solana)" autocomplete="off" spellcheck="false">
    <button id="go" type="submit">Scan</button>
  </form>
  <p class="hint">Chain auto-detected from the address format. EVM scans Ethereum · BSC · Base · Arbitrum · Polygon.</p>
  <div id="out"></div>
</div>
<script>
var f=document.getElementById('f'),addr=document.getElementById('addr'),go=document.getElementById('go'),out=document.getElementById('out');
var CHAIN_IDS={ethereum:1,bsc:56,polygon:137,base:8453,arbitrum:42161,optimism:10};

// Revoking is the one thing here that writes. The rules are deliberate: the calldata is built
// server-side (only three revoking calls exist there), shown in full BEFORE anything is signed,
// signed one at a time by your own wallet, and always exportable so a hardware or offline signer
// can do it instead. This page never sees a key and never batches signatures.
function bindRevoke(){
  var panel=document.getElementById('sign');
  Array.prototype.forEach.call(document.querySelectorAll('button.rev'),function(b){
    b.addEventListener('click',function(){
      var q='chain='+encodeURIComponent(b.dataset.chain)+'&kind='+encodeURIComponent(b.dataset.kind)
           +'&token='+encodeURIComponent(b.dataset.token)+'&spender='+encodeURIComponent(b.dataset.spender)
           +'&owner='+encodeURIComponent(addr.value.trim());
      panel.innerHTML='<div class="status">Building and simulating the transaction…</div>';
      fetch('/v1/revoke?'+q).then(function(r){return r.json();}).then(function(d){
        if(d.error){panel.innerHTML='<div class="err">'+esc(d.error)+'</div>';return;}
        panel.innerHTML=
          '<div class="signbox"><div class="signhead">This is exactly what you would sign</div>'
          +'<div class="mono sigline"><b>call</b> '+esc(d.human.call)+'</div>'
          +'<div class="mono sigline"><b>to</b> '+esc(d.tx.to)+'</div>'
          +'<div class="mono sigline"><b>chain</b> '+esc(d.chain)+' ('+d.chain_id+')  <b>value</b> 0</div>'
          +'<div class="sigline">'+esc(d.human.effect)+'</div>'
          +(function(sm){
             if(!sm) return '';
             if(!sm.simulated) return '<div class="simrow simwarn">⚠ couldn’t simulate on this RPC — the calldata is still correct, its effect just isn’t proven here</div>';
             return sm.works
               ? '<div class="simrow simok">✓ simulated on-chain: this sets the permission to 0 (no gas spent)</div>'
               : '<div class="simrow simwarn">⚠ simulation did not reach zero (executed='+sm.executes+', after='+esc(sm.grant_after)+') — check before signing</div>';
           })(d.simulation)
          +'<div class="mono sigdata">'+esc(d.tx.data)+'</div>'
          +'<div class="sigacts"><button id="dosign">Sign in my wallet</button>'
          +'<button id="docopy" class="ghost">Copy calldata</button></div>'
          +'<div id="signmsg" class="hint"></div></div>';
        var msg=document.getElementById('signmsg');
        document.getElementById('docopy').onclick=function(){
          navigator.clipboard.writeText(JSON.stringify(d.tx,null,2)).then(function(){
            msg.textContent='Copied — sign it with a hardware or offline signer.';});
        };
        document.getElementById('dosign').onclick=function(){
          var eth=window.ethereum;
          if(!eth){msg.textContent='No browser wallet detected. Use “Copy calldata” instead.';return;}
          msg.textContent='Check your wallet…';
          eth.request({method:'eth_requestAccounts'}).then(function(accts){
            return eth.request({method:'wallet_switchEthereumChain',
                                params:[{chainId:d.tx.chainId}]})
              .catch(function(e){ if(e && e.code===4902){throw new Error('Add the '+d.chain+' network to your wallet first.');} throw e; })
              .then(function(){
                return eth.request({method:'eth_sendTransaction',
                  params:[{from:accts[0],to:d.tx.to,data:d.tx.data,value:'0x0'}]});
              });
          }).then(function(hash){
            msg.innerHTML='Sent: <span class="mono">'+esc(hash)+'</span>. Re-scan once it confirms.';
          }).catch(function(e){
            msg.textContent='Not signed: '+((e&&e.message)||'cancelled');
          });
        };
      }).catch(function(e){panel.innerHTML='<div class="err">'+esc(e.message)+'</div>';});
    });
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function short(s){s=String(s||'');return s.length>18?s.slice(0,8)+'…'+s.slice(-6):s;}
function render(d,mode){
  if(d.error){out.innerHTML='<div class="err">'+esc(d.error)+'</div>';return;}
  var scanned=(d.chains_scanned||[]).join(', ');
  var tag=mode==='cached'
    ? '<span class="tag tag-cached">cached'+(d.cached_age_s!=null?' · '+d.cached_age_s+'s ago':'')+' · refreshing…</span>'
    : '<span class="tag tag-live">live</span>';
  var head='<div class="status">'+tag+' <b>'+esc(d.address_type)+'</b> · scanned <b>'+esc(scanned||d.address_type)+'</b> · '
    +'<b>'+d.count+'</b> approvals, <b style="color:var(--risk)">'+d.risky_count+'</b> risky</div>';
  if(d.degraded_chains&&d.degraded_chains.length){
    var note=d.note||'Mine a probe universe for this chain (tools/mine_probe_universe.py) for coverage.';
    head+='<div class="err" style="border-color:var(--warn);background:#2a1f0f;color:var(--warn)">⚠ '
      +d.degraded_chains.length+' EVM chains not scanned ('+esc(d.degraded_chains.join(', '))
      +'). '+esc(note)+'</div>';
  }
  if(d.probed_chains&&d.probed_chains.length){
    head+='<div class="err" style="border-color:var(--accent);background:#0d2a20;color:var(--accent)">◎ '
      +'<b>'+esc(d.probed_chains.join(', '))+'</b>: this chain publishes no free history, so instead of '
      +'reading your past we check your current permissions directly, one by one, widening the search '
      +'around everything we find. It matched the block explorer on our test wallet — but if nothing '
      +'shows up here, that means <b>we found nothing</b>, not that there is nothing.</div>';
  }
  if(d.partial_chains&&d.partial_chains.length){
    head+='<div class="err" style="border-color:var(--warn);background:#2a1f0f;color:var(--warn)">⚠ '
      +'Partial scan on '+esc(d.partial_chains.join(', '))+' — some block ranges could not be read, '
      +'so this list may be incomplete (not a clean bill). Re-scan for full coverage.</div>';
  }
  if(!d.items||!d.items.length){out.innerHTML=head+'<div class="empty">No standing approvals found here. ✅</div>';return;}
  var rows=d.items.map(function(i){
    var lv=i.risk_level||'medium';
    var badge='<span class="lvl lvl-'+esc(lv)+'">'+esc(lv)+' · '+(i.risk_score==null?'?':i.risk_score)+'</span>'
      +(i.unlimited?' <span class="chip" title="unlimited allowance">∞</span>':'');
    var spend;
    if(i.spender_trust==='established'){
      spend='<span class="mono trunc" title="'+esc(i.spender)+'">'+esc(short(i.spender))+'</span>'
        +' <span class="chip chip-est" title="'+esc(i.spender_name||'')+'">established</span>';
    } else if(i.spender_name){
      spend='<span title="'+esc(i.spender)+'">'+esc(i.spender_name)+'</span> <span class="chip">known</span>';
    } else {
      spend='<span class="mono trunc" title="'+esc(i.spender)+'">'+esc(short(i.spender))+'</span>'
        +(i.spender_trust==='unknown'?' <span class="chip">unknown</span>':'');
    }
    var tok;
    if(i.symbol_verified===false){
      tok='<span class="fake" title="This contract calls itself '+esc(i.token_symbol)
        +', but the '+esc(i.token_symbol)+' the market trades is '+esc(i.impersonates)+'">⚠ claims &ldquo;'
        +esc(i.token_symbol)+'&rdquo;</span>';
    } else if(i.symbol_verified===true){
      tok=esc(i.token_symbol)+' <span class="chip" title="this is the contract the market trades under that ticker">verified</span>';
    } else {
      tok=esc(i.token_symbol||'—');
    }
    var tname=(i.token_name&&i.token_name!==i.token_symbol)
      ? '<div class="tname" title="on-chain name()">'+esc(i.token_name)+'</div>' : '';
    return '<tr><td><span class="chip">'+esc(i.chain)+'</span></td>'
      +'<td>'+tok+tname+'<div class="mono trunc" title="'+esc(i.token)+'">'+esc(short(i.token))+'</div></td>'
      +'<td>'+spend+'</td>'
      +'<td class="mono">'+esc({'approval':'token','nft_operator':'NFT · all','permit2':'via Permit2',
                                'delegate':'delegate'}[i.kind]||i.kind)
        +(i.evidence&&i.evidence.expires_unix
          ?'<div class="hint" style="margin:0">until '+esc(new Date(i.evidence.expires_unix*1000).toISOString().slice(0,10))+'</div>':'')
        +'</td>'
      +'<td>'+badge+'</td>'
      +'<td>'+(i.chain && CHAIN_IDS[i.chain] && i.kind!=='delegate'
        ? '<button class="rev" data-chain="'+esc(i.chain)+'" data-kind="'+esc(i.kind)
          +'" data-token="'+esc(i.token)+'" data-spender="'+esc(i.spender)+'">Revoke</button>'
        : '<span class="hint" style="margin:0">—</span>')+'</td></tr>';
  }).join('');
  out.innerHTML=head+'<table><thead><tr><th>Chain</th><th>Token</th><th>Spender</th><th>Type</th><th>Risk</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div id="sign"></div>';
  bindRevoke();
}
f.addEventListener('submit',function(e){
  e.preventDefault();
  var a=addr.value.trim(); if(!a)return;
  go.disabled=true; out.innerHTML='<div class="status">Scanning…</div>';
  function live(){
    fetch('/v1/approvals?address='+encodeURIComponent(a)).then(function(r){return r.json();}).then(function(d){
      go.disabled=false; render(d,'live');
    }).catch(function(err){go.disabled=false;out.innerHTML='<div class="err">Request failed: '+esc(err.message)+'. Is the server running?</div>';});
  }
  // phase 1 — instant paint from the local index (µs); may be empty on a first-ever look-up
  fetch('/v1/approvals?cached=1&address='+encodeURIComponent(a)).then(function(r){return r.json();}).then(function(d){
    if(d&&!d.error&&d.items&&d.items.length) render(d,'cached');
    live();
  }).catch(live);
});
</script>
</body></html>
